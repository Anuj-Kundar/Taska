<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taska — Task Manager</title>

  <!-- Tailwind CSS via Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81'
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Hard hide: beats any display:* set by utility classes and blocks clicks */
    [hidden] {
      display: none !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }
    /* Smooth scrollbars */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    /* Fade/scale animation for overlays */
    .anim-in { animation: animIn .18s ease-out; }
    @keyframes animIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
    .toast-in { animation: toastIn .25s cubic-bezier(.16,1,.3,1); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    [draggable="true"] { cursor: grab; }
    .dragging { opacity: .4; }
    .drop-target { outline: 2px dashed #6366f1; outline-offset: 2px; }
  </style>
</head>

<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased">

  <div class="flex h-full flex-col">
    <!-- ===================== TOP BAR ===================== -->
    <header class="sticky top-0 z-30 flex items-center gap-3 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur px-4 py-3">
      <button id="btnSidebarToggle" class="lg:hidden inline-flex h-10 w-10 items-center justify-center rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle menu" aria-label="Toggle menu">
        <i data-lucide="menu" class="h-5 w-5"></i>
      </button>

      <a href="#" class="flex items-center gap-2 shrink-0" title="Taska home">
        <img src="https://kiro.dev/images/community/events/thumbnails/meetup2.svg" alt="Taska logo" class="h-9 w-9 rounded-lg object-cover ring-1 ring-slate-200 dark:ring-slate-700 bg-white" />
        <span class="text-lg font-extrabold tracking-tight hidden sm:block">Tas<span class="text-brand-600 dark:text-brand-400">ka</span></span>
      </a>

      <!-- Search -->
      <div class="relative ml-2 flex-1 max-w-md">
        <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400"></i>
        <input id="searchInput" type="text" placeholder="Search tasks..."
          class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 py-2 pl-9 pr-9 text-sm outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" />
        <button id="btnClearSearch" hidden class="absolute right-2 top-1/2 -translate-y-1/2 h-6 w-6 inline-flex items-center justify-center rounded hover:bg-slate-200 dark:hover:bg-slate-700" title="Clear search" aria-label="Clear search">
          <i data-lucide="x" class="h-4 w-4"></i>
        </button>
      </div>

      <div class="ml-auto flex items-center gap-1">
        <button id="btnTheme" class="inline-flex h-10 w-10 items-center justify-center rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle theme" aria-label="Toggle theme">
          <i data-lucide="moon" class="h-5 w-5 block dark:hidden"></i>
          <i data-lucide="sun" class="h-5 w-5 hidden dark:block"></i>
        </button>

        <!-- Overflow menu -->
        <div class="relative">
          <button id="btnMore" class="inline-flex h-10 w-10 items-center justify-center rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="More options" aria-haspopup="true" aria-expanded="false">
            <i data-lucide="more-vertical" class="h-5 w-5"></i>
          </button>
          <div id="moreMenu" hidden class="anim-in fixed z-50 w-56 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-1.5 shadow-xl">
            <button data-action="clear-completed" class="menu-item flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition text-left">
              <i data-lucide="check-check" class="h-4 w-4 text-emerald-500"></i> Clear completed
            </button>
            <button data-action="export" class="menu-item flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition text-left">
              <i data-lucide="download" class="h-4 w-4 text-slate-500"></i> Export tasks (JSON)
            </button>
            <button data-action="seed" class="menu-item flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition text-left">
              <i data-lucide="sparkles" class="h-4 w-4 text-amber-500"></i> Load sample data
            </button>
            <div class="my-1 h-px bg-slate-200 dark:bg-slate-700"></div>
            <button data-action="reset" class="menu-item flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-500/10 transition text-left">
              <i data-lucide="trash-2" class="h-4 w-4"></i> Delete all tasks
            </button>
          </div>
        </div>

        <button id="btnAddTaskTop" class="ml-1 hidden sm:inline-flex items-center gap-2 rounded-lg bg-brand-600 hover:bg-brand-700 px-3.5 py-2 text-sm font-semibold text-white shadow-sm transition">
          <i data-lucide="plus" class="h-4 w-4"></i> New task
        </button>
      </div>
    </header>

    <!-- ===================== BODY ===================== -->
    <div class="flex flex-1 overflow-hidden">
      <!-- Sidebar backdrop (mobile) -->
      <div id="sidebarBackdrop" hidden class="fixed inset-0 z-20 bg-slate-900/50 lg:hidden"></div>

      <!-- Sidebar -->
      <aside id="sidebar" class="fixed lg:sticky top-[57px] lg:top-0 z-20 lg:z-0 h-[calc(100dvh-57px)] w-72 shrink-0 -translate-x-full lg:translate-x-0 transition-transform duration-200 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 overflow-y-auto">
        <nav class="p-3 space-y-1">
          <p class="px-3 pt-2 pb-1 text-xs font-semibold uppercase tracking-wider text-slate-400">Views</p>
          <button data-view="all" class="nav-item active flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition">
            <i data-lucide="inbox" class="h-4.5 w-4.5"></i> <span>All tasks</span>
            <span data-count="all" class="ml-auto text-xs font-semibold rounded-full px-2 py-0.5 bg-slate-100 dark:bg-slate-800">0</span>
          </button>
          <button data-view="today" class="nav-item flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition">
            <i data-lucide="calendar-clock" class="h-4.5 w-4.5"></i> <span>Today</span>
            <span data-count="today" class="ml-auto text-xs font-semibold rounded-full px-2 py-0.5 bg-slate-100 dark:bg-slate-800">0</span>
          </button>
          <button data-view="upcoming" class="nav-item flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition">
            <i data-lucide="calendar-days" class="h-4.5 w-4.5"></i> <span>Upcoming</span>
            <span data-count="upcoming" class="ml-auto text-xs font-semibold rounded-full px-2 py-0.5 bg-slate-100 dark:bg-slate-800">0</span>
          </button>
          <button data-view="starred" class="nav-item flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition">
            <i data-lucide="star" class="h-4.5 w-4.5"></i> <span>Starred</span>
            <span data-count="starred" class="ml-auto text-xs font-semibold rounded-full px-2 py-0.5 bg-slate-100 dark:bg-slate-800">0</span>
          </button>
          <button data-view="completed" class="nav-item flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition">
            <i data-lucide="check-circle-2" class="h-4.5 w-4.5"></i> <span>Completed</span>
            <span data-count="completed" class="ml-auto text-xs font-semibold rounded-full px-2 py-0.5 bg-slate-100 dark:bg-slate-800">0</span>
          </button>

          <p class="px-3 pt-4 pb-1 text-xs font-semibold uppercase tracking-wider text-slate-400">Categories</p>
          <div id="categoryList" class="space-y-1"><!-- injected --></div>
        </nav>

        <div class="p-3 mt-2">
          <div class="rounded-xl bg-gradient-to-br from-brand-600 to-brand-800 p-4 text-white">
            <div class="flex items-center gap-2 text-sm font-semibold"><i data-lucide="trending-up" class="h-4 w-4"></i> Progress</div>
            <div class="mt-3">
              <div class="flex items-end justify-between text-xs">
                <span id="progressLabel">0 of 0 done</span>
                <span id="progressPct" class="font-bold">0%</span>
              </div>
              <div class="mt-1.5 h-2 w-full rounded-full bg-white/25 overflow-hidden">
                <div id="progressBar" class="h-full rounded-full bg-white transition-all duration-500" style="width:0%"></div>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main -->
      <main class="flex-1 overflow-y-auto">
        <div class="mx-auto max-w-4xl px-4 py-6">
          <!-- Title + controls -->
          <div class="flex flex-wrap items-center gap-3">
            <div>
              <h1 id="viewTitle" class="text-2xl font-extrabold tracking-tight">All tasks</h1>
              <p id="viewSubtitle" class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Everything on your plate</p>
            </div>

            <div class="ml-auto flex items-center gap-2">
              <!-- Sort dropdown -->
              <div class="relative">
                <button id="btnSort" class="inline-flex items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition" aria-haspopup="true" aria-expanded="false">
                  <i data-lucide="arrow-up-down" class="h-4 w-4"></i>
                  <span class="hidden sm:inline">Sort</span>
                </button>
                <div id="sortMenu" hidden class="anim-in fixed z-50 w-48 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-1.5 shadow-xl">
                  <button data-sort="created" class="sort-item flex w-full items-center justify-between gap-2 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 text-left"><span>Newest first</span><i data-lucide="check" class="check h-4 w-4 text-brand-500"></i></button>
                  <button data-sort="due" class="sort-item flex w-full items-center justify-between gap-2 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 text-left"><span>Due date</span><i data-lucide="check" class="check h-4 w-4 text-brand-500" hidden></i></button>
                  <button data-sort="priority" class="sort-item flex w-full items-center justify-between gap-2 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 text-left"><span>Priority</span><i data-lucide="check" class="check h-4 w-4 text-brand-500" hidden></i></button>
                  <button data-sort="alpha" class="sort-item flex w-full items-center justify-between gap-2 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 text-left"><span>Alphabetical</span><i data-lucide="check" class="check h-4 w-4 text-brand-500" hidden></i></button>
                </div>
              </div>

              <button id="btnAddTask" class="inline-flex items-center gap-2 rounded-lg bg-brand-600 hover:bg-brand-700 px-3.5 py-2 text-sm font-semibold text-white shadow-sm transition">
                <i data-lucide="plus" class="h-4 w-4"></i> <span class="hidden sm:inline">New task</span>
              </button>
            </div>
          </div>

          <!-- Priority filter chips -->
          <div class="mt-5 flex flex-wrap items-center gap-2">
            <button data-priority-filter="all" class="chip active rounded-full border px-3 py-1.5 text-xs font-semibold transition">All</button>
            <button data-priority-filter="high" class="chip rounded-full border px-3 py-1.5 text-xs font-semibold transition">High</button>
            <button data-priority-filter="medium" class="chip rounded-full border px-3 py-1.5 text-xs font-semibold transition">Medium</button>
            <button data-priority-filter="low" class="chip rounded-full border px-3 py-1.5 text-xs font-semibold transition">Low</button>
          </div>

          <!-- Task list -->
          <div id="taskList" class="mt-5 space-y-2.5"><!-- injected --></div>

          <!-- Empty state -->
          <div id="emptyState" hidden class="mt-16 flex flex-col items-center text-center">
            <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-brand-50 dark:bg-brand-500/10 text-brand-500">
              <i data-lucide="clipboard-list" class="h-8 w-8"></i>
            </div>
            <h3 class="mt-4 text-lg font-bold">Nothing here yet</h3>
            <p class="mt-1 text-sm text-slate-500 dark:text-slate-400 max-w-xs" id="emptyText">Create your first task to get started.</p>
            <button id="btnEmptyAdd" class="mt-5 inline-flex items-center gap-2 rounded-lg bg-brand-600 hover:bg-brand-700 px-4 py-2 text-sm font-semibold text-white transition">
              <i data-lucide="plus" class="h-4 w-4"></i> New task
            </button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Floating add button (mobile) -->
  <button id="btnFab" class="sm:hidden fixed bottom-5 right-5 z-30 inline-flex h-14 w-14 items-center justify-center rounded-full bg-brand-600 hover:bg-brand-700 text-white shadow-lg transition" title="New task" aria-label="New task">
    <i data-lucide="plus" class="h-6 w-6"></i>
  </button>

  <!-- ===================== TASK MODAL ===================== -->
  <div id="taskModal" hidden class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="modal-backdrop absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
    <div class="anim-in relative w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl bg-white dark:bg-slate-900 shadow-2xl border border-slate-200 dark:border-slate-800 max-h-[92dvh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 px-5 py-4">
        <h2 id="modalTitle" class="text-lg font-bold">New task</h2>
        <button data-close="taskModal" class="inline-flex h-9 w-9 items-center justify-center rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Close" aria-label="Close">
          <i data-lucide="x" class="h-5 w-5"></i>
        </button>
      </div>

      <form id="taskForm" class="p-5 space-y-4">
        <input type="hidden" id="taskId" />
        <div>
          <label class="block text-sm font-medium mb-1.5" for="fTitle">Title</label>
          <input id="fTitle" required type="text" placeholder="What needs to be done?"
            class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5" for="fNotes">Notes</label>
          <textarea id="fNotes" rows="3" placeholder="Add details (optional)"
            class="w-full resize-none rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"></textarea>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1.5" for="fDue">Due date</label>
            <input id="fDue" type="date"
              class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5" for="fCategory">Category</label>
            <select id="fCategory"
              class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition">
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Shopping">Shopping</option>
              <option value="Health">Health</option>
              <option value="Learning">Learning</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">Priority</label>
          <div class="grid grid-cols-3 gap-2" id="priorityPicker">
            <label class="prio-opt cursor-pointer rounded-lg border px-3 py-2 text-center text-sm font-medium transition" data-prio="low">
              <input type="radio" name="priority" value="low" class="sr-only" /> Low
            </label>
            <label class="prio-opt cursor-pointer rounded-lg border px-3 py-2 text-center text-sm font-medium transition" data-prio="medium">
              <input type="radio" name="priority" value="medium" class="sr-only" checked /> Medium
            </label>
            <label class="prio-opt cursor-pointer rounded-lg border px-3 py-2 text-center text-sm font-medium transition" data-prio="high">
              <input type="radio" name="priority" value="high" class="sr-only" /> High
            </label>
          </div>
        </div>

        <!-- Subtasks editor -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-sm font-medium" for="fSubInput">Subtasks</label>
            <span id="fSubProgress" class="text-xs font-medium text-slate-400"></span>
          </div>
          <div class="flex items-center gap-2">
            <input id="fSubInput" type="text" placeholder="Add a subtask..."
              class="flex-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" />
            <button type="button" id="fSubAdd" class="inline-flex items-center gap-1 rounded-lg border border-slate-200 dark:border-slate-700 px-3 py-2 text-sm font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 transition">
              <i data-lucide="plus" class="h-4 w-4"></i> Add
            </button>
          </div>
          <ul id="fSubList" class="mt-2 space-y-1.5"></ul>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" data-close="taskModal" class="rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2 text-sm font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 transition">Cancel</button>
          <button type="submit" class="inline-flex items-center gap-2 rounded-lg bg-brand-600 hover:bg-brand-700 px-4 py-2 text-sm font-semibold text-white transition">
            <i data-lucide="check" class="h-4 w-4"></i> <span id="saveBtnText">Create task</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================== CONFIRM MODAL ===================== -->
  <div id="confirmModal" hidden class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
    <div class="anim-in relative w-full max-w-sm rounded-2xl bg-white dark:bg-slate-900 shadow-2xl border border-slate-200 dark:border-slate-800 p-6">
      <div class="flex h-12 w-12 items-center justify-center rounded-full bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400">
        <i data-lucide="alert-triangle" class="h-6 w-6"></i>
      </div>
      <h2 id="confirmTitle" class="mt-4 text-lg font-bold">Are you sure?</h2>
      <p id="confirmText" class="mt-1 text-sm text-slate-500 dark:text-slate-400">This action cannot be undone.</p>
      <div class="mt-6 flex items-center justify-end gap-2">
        <button data-close="confirmModal" class="rounded-lg border border-slate-200 dark:border-slate-700 px-4 py-2 text-sm font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 transition">Cancel</button>
        <button id="confirmOk" class="inline-flex items-center gap-2 rounded-lg bg-red-600 hover:bg-red-700 px-4 py-2 text-sm font-semibold text-white transition">
          <i data-lucide="trash-2" class="h-4 w-4"></i> Delete
        </button>
      </div>
    </div>
  </div>

  <!-- ===================== TOASTS ===================== -->
  <div id="toastWrap" class="fixed bottom-5 left-1/2 -translate-x-1/2 sm:left-auto sm:right-5 sm:translate-x-0 z-[60] flex flex-col gap-2 pointer-events-none"></div>

  <script src="app.js"></script>
</body>
</html>
